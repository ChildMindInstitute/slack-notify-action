[project]
name = "slack-notify-tests"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3.1", "slack-sdk>=3.33", "pyyaml>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
src = ["."]


[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "PTH",      # prefer pathlib
    "RUF",      # ruff-specific
    "S",        # bandit
    "T20",      # no stray print()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S603",  # subprocess with a fixed argv list
    "S607",  # partial executable path (bash)
]


[tool.ruff.format]
skip-magic-trailing-comma = false
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["render_slack.py", "tests"]

[tool.ty.terminal]
error-on-warning = true

