[project]
name = "slack-notify-tests"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3.1", "slack-sdk>=3.33", "pyyaml>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "E5", "I"]
ignore = []

[tool.ruff.format]
skip-magic-trailing-comma = false
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 15

#[tool.ruff.lint.isort]
#known-local-folder = ["src"]